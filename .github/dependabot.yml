# TEST ONLY (fork): does Dependabot read the base image from `ARG NODE_IMAGE`
# in the Dockerfile? Docker ecosystem only, no ignores. Revert after the test.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
# Run 2: FROM lines now name the image directly (no ARG).
# Run 3: majors ignored, expect a Node 24 minor/patch bump instead of 26.
